# Link-preview crawlers (WhatsApp, Instagram/Facebook, Snapchat, X, Telegram...) don't run
# JavaScript, so they get a server-rendered preview from the seo-preview edge function.
map $http_user_agent $is_preview_bot {
    default 0;
    ~*(facebookexternalhit|facebot|whatsapp|twitterbot|linkedinbot|slackbot|telegrambot|snapchat|pinterest|discordbot|redditbot|skypeuripreview|applebot|vkshare|embedly) 1;
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Supabase edge functions are reached by name; resolving at request time (via a variable)
    # means nginx still starts if DNS is briefly unavailable
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;
    set $supabase_host yubebbfsmlopmnluajgf.supabase.co;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Sitemap is generated live from the catalog
    location = /sitemap.xml {
        proxy_pass https://$supabase_host/functions/v1/sitemap;
        proxy_set_header Host $supabase_host;
        proxy_ssl_server_name on;
        # Supabase serves function output as text/plain with a sandbox CSP and its own cookie;
        # search engines need a real XML response from our domain
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Content-Type "application/xml; charset=utf-8" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Handle React Router - serve index.html for all routes; preview crawlers get rendered meta tags
    location / {
        if ($is_preview_bot) {
            proxy_pass https://$supabase_host/functions/v1/seo-preview?path=$uri&$args;
            add_header Content-Type "text/html; charset=utf-8" always;
        }
        proxy_set_header Host $supabase_host;
        proxy_ssl_server_name on;
        # Only affect proxied (preview) responses: replace Supabase's text/plain + sandbox CSP
        proxy_hide_header Content-Type;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Set-Cookie;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
