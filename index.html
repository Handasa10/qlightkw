          "telephone": "+96551111725",
          "email": "info@qlightkw.com",
          "priceRange": "KWD",
          "currenciesAccepted": "KWD",
          "paymentAccepted": "Cash, KNET, Bank Transfer",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "Tunis Street, in front of Rihab Complex",
            "addressLocality": "Hawalli",
            "addressCountry": "KW"
          },
          "geo": { "@type": "GeoCoordinates", "latitude": 29.3375, "longitude": 48.0285 },
          "areaServed": { "@type": "Country", "name": "Kuwait" },
          "openingHoursSpecification": [{
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Saturday", "Sunday", "Monday", "Tuesday", "Wednesday", "Thursday"],
            "opens": "09:00",
            "closes": "21:00"
          }],

          ]
        },
        {

          "@id": "https://qlightkw.com/#website",

          "name": "Quality Light Kuwait",
          "alternateName": "كواليتي لايت الكويت",
          "inLanguage": ["en", "ar"],
          "publisher": { "@id": "https://qlightkw.com/#store" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://qlightkw.com/shop?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }

    <!-- Theme Color for Mobile Browsers -->
    <meta name="theme-color" content="#F97316" />
    <meta name="msapplication-TileColor" content="#F97316" />
    
    <!-- Prevent Flash of Unstyled Content -->
    <script>
      // Check for saved theme preference or default to system preference
      const theme = localStorage.getItem('theme') || 
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', theme === 'dark');
      
      // Check for saved language preference
      const urlLang = new URLSearchParams(location.search).get('lang');
      const lang = (urlLang === 'ar' || urlLang === 'en') ? urlLang : (localStorage.getItem('language') || 'en');
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    </script>
  </head>

  <body>
